{% load i18n %}
<div class="lang-switch-fixed" style="position:fixed;top:12px;right:12px;z-index:1050;">
    <form action="{% url 'set_language' %}" method="post" style="display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.96);padding:8px 10px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.12);border:1px solid rgba(0,0,0,0.06);">
        {% csrf_token %}
        <input name="next" type="hidden" value="{{ request.get_full_path }}">
        <label class="visually-hidden" for="id_fixed_lang_select">{% trans "Language" %}</label>
        <select name="language" id="id_fixed_lang_select" class="form-select form-select-sm" style="width:auto;max-width:140px;font-size:12px;">
            {% get_current_language as LANGUAGE_CODE %}
            {% get_available_languages as LANGUAGES %}
            {% for lang in LANGUAGES %}
                <option value="{{ lang.0 }}" {% if lang.0 == LANGUAGE_CODE %}selected{% endif %}>{{ lang.1 }}</option>
            {% endfor %}
        </select>
        <button type="submit" class="btn btn-sm btn-primary" style="font-size:12px;padding:4px 10px;white-space:nowrap;">{% trans "Change" %}</button>
    </form>
</div>
