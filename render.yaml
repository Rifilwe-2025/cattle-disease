# Render Blueprint for CattleCare AI.
#
# The database is NOT defined here - it lives on Neon, and DATABASE_URL is
# set as a secret env var (sync: false) so the connection string never enters
# this repo, which is public.
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.

services:
  - type: web
    name: cattlecare-ai
    runtime: python
    plan: free
    region: oregon
    branch: main

    buildCommand: "./build.sh"

    # 2 workers x 4 threads fits the free plan's 512MB once scikit-learn,
    # pandas and the pickled model are resident. More workers would multiply
    # that footprint and get the process OOM-killed.
    #
    # --preload loads the app - and with it the pickled model, via
    # MlEngineConfig.ready() - once in the master process, before forking.
    # Two things come of that: the workers inherit the loaded model through
    # copy-on-write instead of each unpickling its own copy, and no worker
    # starts serving until the model is in memory. Without it the first farmer
    # to submit a case after a deploy pays the load cost inside their request.
    #
    # --timeout 120 because free instances cold-start after 15 minutes idle.
    startCommand: "gunicorn cattle_disease_system.wsgi:application --workers 2 --threads 4 --preload --timeout 120 --access-logfile - --error-logfile -"

    healthCheckPath: /

    envVars:
      # Matches the local interpreter the .pkl artifacts were pickled under,
      # so the unpickled estimator behaves identically to local.
      - key: PYTHON_VERSION
        value: "3.12.10"

      - key: DJANGO_DEBUG
        value: "False"

      # Generated once by Render and then held constant. Rotating it would
      # invalidate every active session and password-reset link.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      # Neon connection string. Set in the Dashboard, never committed.
      - key: DATABASE_URL
        sync: false

      # SMTP credentials. These carry the password-reset link/OTP and the
      # notification a vet gets when a farmer assigns them a case. Leave
      # either unset and Django falls back to the console backend, which logs
      # the message instead of sending it.
      #
      # NOT Gmail. Render's free plan blocks outbound SMTP on ports 25, 465
      # and 587, and Gmail offers only 587 and 465 - the connection fails with
      # "[Errno 101] Network is unreachable" no matter how correct the
      # credentials are. Port 2525 is not blocked, so a relay that listens
      # there (Brevo, SendGrid, Mailgun) is the way out on the free plan. See
      # EMAIL_SETUP.md. A paid instance unblocks 587 and can use Gmail.
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

      # Defaults are smtp.gmail.com:587, which cannot work here - see above.
      # Set these to the relay, e.g. smtp-relay.brevo.com and 2525.
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false

      # The From address. Defaults to EMAIL_HOST_USER, which is wrong for a
      # relay whose login is not a real mailbox - the mail would then come
      # from an address that cannot receive a reply, or be refused outright as
      # an unverified sender.
      - key: DEFAULT_FROM_EMAIL
        sync: false
